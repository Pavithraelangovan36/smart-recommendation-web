<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - SmartRecommend</title>
  <meta name="description" content="Secure administrative sign in for managing product catalogs, content articles, user moderation, and marketing analytics.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="bg-dark" style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Simple Navigation Bar -->
  <nav class="navbar navbar-dark bg-dark border-bottom border-secondary border-opacity-25 py-3">
    <div class="container">
      <a class="navbar-brand navbar-brand-logo text-white" href="index.html">
        <i class="bi bi-cpu-fill text-primary"></i> SmartRecommend <span class="badge bg-danger ms-2 fs-6 rounded-pill">Admin</span>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Return to Storefront
      </a>
    </div>
  </nav>

  <!-- Login Main -->
  <main class="flex-grow-1 d-flex align-items-center py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-5">
          <div class="card border-0 shadow-lg rounded-4 p-4 p-md-5 bg-white">
            <div class="text-center mb-4">
              <div class="rounded-circle bg-danger-subtle text-danger mx-auto mb-3 d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                <i class="bi bi-shield-lock-fill fs-2"></i>
              </div>
              <h3 class="fw-bold text-dark">Administrator Portal</h3>
              <p class="text-muted small">Sign in to access catalog management and marketing analytics.</p>
            </div>

            <!-- Error Banner -->
            <div id="admin-error" class="alert alert-danger d-none py-2 small" role="alert"></div>

            <form onsubmit="return handleAdminLogin(event)">
              <div class="mb-3">
                <label for="admin-email" class="form-label fw-semibold small text-dark">Admin Email</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
                  <input type="email" class="form-control border-start-0" id="admin-email" value="admin@smartrecommend.com" required>
                </div>
              </div>

              <div class="mb-4">
                <label for="admin-password" class="form-label fw-semibold small text-dark">Password</label>
                <div class="input-group">
                  <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-key"></i></span>
                  <input type="password" class="form-control border-start-0" id="admin-password" value="admin123" required>
                </div>
              </div>

              <button type="submit" class="btn btn-primary w-100 py-2 rounded-pill fw-bold shadow-sm mb-3">
                Sign In to Dashboard
              </button>
            </form>

            <!-- Quick Auto-Fill Demo Admin Credentials Button -->
            <button type="button" class="btn btn-outline-secondary w-100 py-2 rounded-pill small fw-semibold d-flex align-items-center justify-content-center gap-2 mb-3" onclick="fillDemoAdminCredentials()">
              <i class="bi bi-magic text-primary"></i> Pre-Fill Demo Credentials (admin123)
            </button>

            <div class="alert alert-light border small text-muted mb-0">
              <i class="bi bi-info-circle me-1 text-primary"></i> <strong>Demo Credentials:</strong><br>
              Email: <code>admin@smartrecommend.com</code><br>
              Password: <code>admin123</code>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>

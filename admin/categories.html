<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Categories - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand">
      <i class="bi bi-cpu-fill text-primary fs-4"></i>
      <span>SmartRecommend</span>
    </div>

    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="products.html" class="admin-nav-item"><i class="bi bi-box-seam"></i> Products</a>
      <a href="content.html" class="admin-nav-item"><i class="bi bi-journal-richtext"></i> Content</a>
      <a href="users.html" class="admin-nav-item"><i class="bi bi-people"></i> Users</a>
      <a href="categories.html" class="admin-nav-item active"><i class="bi bi-tags"></i> Categories</a>
      <a href="feedback.html" class="admin-nav-item"><i class="bi bi-chat-heart"></i> Feedback</a>
      <a href="analytics.html" class="admin-nav-item"><i class="bi bi-graph-up"></i> Analytics</a>
      <a href="settings.html" class="admin-nav-item"><i class="bi bi-gear"></i> Settings</a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2 rounded-pill">
        <i class="bi bi-shop me-1"></i> Live Storefront
      </a>
      <button class="btn btn-danger btn-sm w-100 rounded-pill" onclick="handleAdminLogout()">
        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none border shadow-sm" type="button" onclick="document.getElementById('adminSidebar').classList.toggle('show')">
          <i class="bi bi-list fs-5"></i>
        </button>
        <div>
          <h2 class="fw-bold text-dark mb-0">Category Management</h2>
          <small class="text-muted">Manage product and interest taxonomy used by the scoring engine.</small>
        </div>
      </div>
      <button class="btn btn-primary rounded-pill px-4 shadow-sm" data-bs-toggle="modal" data-bs-target="#addCategoryModal">
        <i class="bi bi-plus-lg me-1"></i> Add Category
      </button>
    </header>

    <!-- Categories Grid -->
    <div class="row" id="admin-categories-grid">
      <!-- Injected by js/admin.js -->
    </div>
  </main>

  <!-- Add Category Modal -->
  <div class="modal fade" id="addCategoryModal" tabindex="-1" aria-labelledby="addCategoryModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 border-0 shadow">
        <div class="modal-header border-bottom">
          <h5 class="modal-title fw-bold" id="addCategoryModalLabel">Add New Category</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form onsubmit="return handleAddCategory(event)">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label for="cat-name" class="form-label fw-semibold small">Category Name <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="cat-name" placeholder="e.g. Gaming, Home Decor" required>
            </div>
            <div class="mb-3">
              <label for="cat-icon" class="form-label fw-semibold small">Bootstrap Icon Class</label>
              <input type="text" class="form-control" id="cat-icon" placeholder="bi-controller" value="bi-tag">
              <small class="text-muted">Example: bi-laptop, bi-controller, bi-camera</small>
            </div>
            <div class="mb-3">
              <label for="cat-desc" class="form-label fw-semibold small">Short Description</label>
              <input type="text" class="form-control" id="cat-desc" placeholder="Brief category description">
            </div>
          </div>
          <div class="modal-footer border-top">
            <button type="button" class="btn btn-light rounded-pill px-4" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn btn-primary rounded-pill px-4">Create Category</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>

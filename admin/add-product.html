<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Product - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand">
      <i class="bi bi-cpu-fill text-primary fs-4"></i>
      <span>SmartRecommend</span>
    </div>

    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="products.html" class="admin-nav-item active"><i class="bi bi-box-seam"></i> Products</a>
      <a href="content.html" class="admin-nav-item"><i class="bi bi-journal-richtext"></i> Content</a>
      <a href="users.html" class="admin-nav-item"><i class="bi bi-people"></i> Users</a>
      <a href="categories.html" class="admin-nav-item"><i class="bi bi-tags"></i> Categories</a>
      <a href="feedback.html" class="admin-nav-item"><i class="bi bi-chat-heart"></i> Feedback</a>
      <a href="analytics.html" class="admin-nav-item"><i class="bi bi-graph-up"></i> Analytics</a>
      <a href="settings.html" class="admin-nav-item"><i class="bi bi-gear"></i> Settings</a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2 rounded-pill">
        <i class="bi bi-shop me-1"></i> Live Storefront
      </a>
      <button class="btn btn-danger btn-sm w-100 rounded-pill" onclick="handleAdminLogout()">
        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none border shadow-sm" type="button" onclick="document.getElementById('adminSidebar').classList.toggle('show')">
          <i class="bi bi-list fs-5"></i>
        </button>
        <div>
          <h2 class="fw-bold text-dark mb-0">Add New Product</h2>
          <small class="text-muted">Enter product specifications to publish to catalog.</small>
        </div>
      </div>
      <a href="products.html" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="bi bi-arrow-left me-1"></i> Back to Products
      </a>
    </header>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <form onsubmit="return handleAddProduct(event)">
        <div class="row g-4">
          <div class="col-12 col-md-8">
            <label for="prod-name" class="form-label fw-bold small text-dark">Product Title <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="prod-name" placeholder="e.g. UltraFit Horizon Smartwatch" required>
          </div>

          <div class="col-12 col-md-4">
            <label for="prod-brand" class="form-label fw-bold small text-dark">Brand / Manufacturer</label>
            <input type="text" class="form-control" id="prod-brand" placeholder="e.g. AeroTech" value="AeroTech">
          </div>

          <div class="col-12 col-md-4">
            <label for="prod-category" class="form-label fw-bold small text-dark">Category <span class="text-danger">*</span></label>
            <select class="form-select" id="prod-category" required>
              <option value="Electronics" selected>Electronics</option>
              <option value="Fashion">Fashion</option>
              <option value="Books">Books</option>
              <option value="Beauty">Beauty</option>
              <option value="Sports">Sports</option>
              <option value="Travel">Travel</option>
              <option value="Food">Food</option>
              <option value="Lifestyle">Lifestyle</option>
            </select>
          </div>

          <div class="col-12 col-md-4">
            <label for="prod-price" class="form-label fw-bold small text-dark">Selling Price (₹) <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="prod-price" placeholder="2499" min="1" required>
          </div>

          <div class="col-12 col-md-4">
            <label for="prod-orig-price" class="form-label fw-bold small text-dark">Original MRP (₹)</label>
            <input type="number" class="form-control" id="prod-orig-price" placeholder="3499" min="1">
          </div>

          <div class="col-12">
            <label for="prod-image" class="form-label fw-bold small text-dark">Image URL</label>
            <input type="url" class="form-control" id="prod-image" placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80">
            <small class="text-muted">Uses Unsplash high-resolution CDN images with automatic fallback.</small>
          </div>

          <div class="col-12">
            <label for="prod-description" class="form-label fw-bold small text-dark">Product Description <span class="text-danger">*</span></label>
            <textarea class="form-control" id="prod-description" rows="3" placeholder="Provide detailed product overview..." required></textarea>
          </div>

          <div class="col-12">
            <label for="prod-features" class="form-label fw-bold small text-dark">Key Highlights (1 per line)</label>
            <textarea class="form-control" id="prod-features" rows="3" placeholder="Active Noise Cancellation&#10;Up to 40h Battery Playtime&#10;Water resistant IPX7"></textarea>
          </div>

          <div class="col-12">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="prod-instock" checked>
              <label class="form-check-label fw-semibold" for="prod-instock">Product in Stock & Available for Instant Order</label>
            </div>
          </div>

          <div class="col-12 mt-4 pt-3 border-top d-flex gap-3">
            <button type="submit" class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow-sm">
              <i class="bi bi-check-lg me-1"></i> Save & Publish Product
            </button>
            <a href="products.html" class="btn btn-light rounded-pill px-4 py-2 border">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>

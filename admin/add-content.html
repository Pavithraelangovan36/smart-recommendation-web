<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Article - Admin Portal</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">

  <!-- Sidebar -->
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="admin-brand">
      <i class="bi bi-cpu-fill text-primary fs-4"></i>
      <span>SmartRecommend</span>
    </div>

    <nav class="admin-nav">
      <a href="dashboard.html" class="admin-nav-item"><i class="bi bi-speedometer2"></i> Dashboard</a>
      <a href="products.html" class="admin-nav-item"><i class="bi bi-box-seam"></i> Products</a>
      <a href="content.html" class="admin-nav-item active"><i class="bi bi-journal-richtext"></i> Content</a>
      <a href="users.html" class="admin-nav-item"><i class="bi bi-people"></i> Users</a>
      <a href="categories.html" class="admin-nav-item"><i class="bi bi-tags"></i> Categories</a>
      <a href="feedback.html" class="admin-nav-item"><i class="bi bi-chat-heart"></i> Feedback</a>
      <a href="analytics.html" class="admin-nav-item"><i class="bi bi-graph-up"></i> Analytics</a>
      <a href="settings.html" class="admin-nav-item"><i class="bi bi-gear"></i> Settings</a>
    </nav>

    <div class="admin-sidebar-footer">
      <a href="../index.html" class="btn btn-outline-light btn-sm w-100 mb-2 rounded-pill">
        <i class="bi bi-shop me-1"></i> Live Storefront
      </a>
      <button class="btn btn-danger btn-sm w-100 rounded-pill" onclick="handleAdminLogout()">
        <i class="bi bi-box-arrow-right me-1"></i> Sign Out
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="admin-main">
    <header class="admin-topbar">
      <div class="d-flex align-items-center gap-3">
        <button class="btn btn-light d-lg-none border shadow-sm" type="button" onclick="document.getElementById('adminSidebar').classList.toggle('show')">
          <i class="bi bi-list fs-5"></i>
        </button>
        <div>
          <h2 class="fw-bold text-dark mb-0">Publish New Article</h2>
          <small class="text-muted">Draft and release educational guides to the content library.</small>
        </div>
      </div>
      <a href="content.html" class="btn btn-outline-secondary rounded-pill px-4">
        <i class="bi bi-arrow-left me-1"></i> Back to Content
      </a>
    </header>

    <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 bg-white">
      <form onsubmit="return handleAddContent(event)">
        <div class="row g-4">
          <div class="col-12 col-md-8">
            <label for="art-title" class="form-label fw-bold small text-dark">Article Headline <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="art-title" placeholder="e.g. Modern Omnichannel Marketing & Recommendation Strategies" required>
          </div>

          <div class="col-12 col-md-4">
            <label for="art-category" class="form-label fw-bold small text-dark">Category <span class="text-danger">*</span></label>
            <select class="form-select" id="art-category" required>
              <option value="Digital Marketing" selected>Digital Marketing</option>
              <option value="Technology">Technology</option>
              <option value="Shopping">Shopping</option>
              <option value="Lifestyle">Lifestyle</option>
              <option value="Fashion">Fashion</option>
              <option value="Travel">Travel</option>
              <option value="Beauty">Beauty</option>
              <option value="Sports">Sports</option>
              <option value="Finance">Finance</option>
            </select>
          </div>

          <div class="col-12 col-md-6">
            <label for="art-author" class="form-label fw-bold small text-dark">Author Name</label>
            <input type="text" class="form-control" id="art-author" placeholder="e.g. Dr. Vikram Patel" value="Editorial Team">
          </div>

          <div class="col-12 col-md-6">
            <label for="art-reading-time" class="form-label fw-bold small text-dark">Estimated Reading Time</label>
            <input type="text" class="form-control" id="art-reading-time" placeholder="e.g. 6 min read" value="5 min read">
          </div>

          <div class="col-12">
            <label for="art-image" class="form-label fw-bold small text-dark">Cover Image URL</label>
            <input type="url" class="form-control" id="art-image" placeholder="https://images.unsplash.com/..." value="https://images.unsplash.com/photo-1460925895917-afdab827c52f?auto=format&fit=crop&w=800&q=80">
          </div>

          <div class="col-12">
            <label for="art-summary" class="form-label fw-bold small text-dark">Executive Summary <span class="text-danger">*</span></label>
            <textarea class="form-control" id="art-summary" rows="2" placeholder="Brief 1-2 sentence lead overview..." required></textarea>
          </div>

          <div class="col-12">
            <label for="art-body" class="form-label fw-bold small text-dark">Full Article Body <span class="text-danger">*</span></label>
            <textarea class="form-control" id="art-body" rows="6" placeholder="Write full article text here. Supports markdown ### Headings and bullet points..." required></textarea>
          </div>

          <div class="col-12 mt-4 pt-3 border-top d-flex gap-3">
            <button type="submit" class="btn btn-primary rounded-pill px-5 py-2 fw-bold shadow-sm">
              <i class="bi bi-cloud-arrow-up-fill me-1"></i> Publish Article
            </button>
            <a href="content.html" class="btn btn-light rounded-pill px-4 py-2 border">Cancel</a>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
